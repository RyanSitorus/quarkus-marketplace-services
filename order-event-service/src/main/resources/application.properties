quarkus.application.name=order-event-service
quarkus.http.port=8080

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:orders_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=update

quarkus.datasource.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.raw-orders-out.connector=smallrye-kafka
mp.messaging.outgoing.raw-orders-out.topic=raw-orders
mp.messaging.outgoing.raw-orders-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.raw-orders-in.connector=smallrye-kafka
mp.messaging.incoming.raw-orders-in.topic=raw-orders
mp.messaging.incoming.raw-orders-in.group.id=order-processor-group
mp.messaging.incoming.raw-orders-in.auto.offset.reset=earliest
mp.messaging.incoming.raw-orders-in.value.deserializer=com.marketplace.order.serialization.RawOrderDeserializer

mp.messaging.outgoing.processed-orders-out.connector=smallrye-kafka
mp.messaging.outgoing.processed-orders-out.topic=processed-orders
mp.messaging.outgoing.processed-orders-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

%test.mp.messaging.outgoing.raw-orders-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.raw-orders-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.processed-orders-out.connector=smallrye-in-memory

%postgres.quarkus.datasource.db-kind=postgresql
%postgres.quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/orders_db}
%postgres.quarkus.datasource.username=${POSTGRES_USER:postgres}
%postgres.quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
